services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      soldicom:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
