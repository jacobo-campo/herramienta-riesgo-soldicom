services:
  soldicom:
    build:
      context: .
      dockerfile: Dockerfile
    image: herramienta-riesgo-soldicom:local
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8501}:8501"
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    command:
      - /bin/sh
      - -ec
      - |
        test -f /app/.streamlit/secrets.toml
        exec /app/.venv/bin/streamlit run app.py --server.headless=true --server.address=0.0.0.0 --server.port=8501
    configs:
      - source: streamlit_secrets
        target: /app/.streamlit/secrets.toml

configs:
  streamlit_secrets:
    file: ${STREAMLIT_SECRETS_FILE:?Set STREAMLIT_SECRETS_FILE to an existing secrets.toml file}
