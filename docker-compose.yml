services:
  soldicom:
    build:
      context: .
      dockerfile: Dockerfile
    image: herramienta-riesgo-soldicom:local
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8501}:8501"
    restart: unless-stopped
    environment:
      TZ: America/Bogota
      HISTORY_DB_PATH: ${HISTORY_DB_PATH:-/app/data/historico.sqlite3}
    volumes:
      - type: bind
        source: ${SOLDICOM_DATA_DIR:-./data}
        target: /app/data
        bind:
          create_host_path: false
